version: "3.8"

# ── AIVORY User Dashboard (nextjs-console) ─────────────────────────────────────
# Exposes https://dashboard.aivory.id via the existing Traefik reverse proxy.
# Run this file alongside your main docker-compose.yml using:
#   docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d

services:
  aivory-dashboard:
    build:
      context: ./nextjs-console
      dockerfile: Dockerfile
    container_name: aivory-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Backend API (served through Traefik)
      NEXT_PUBLIC_API_URL: https://backend.aivory.id
      # n8n editor URL (internal)
      NEXT_PUBLIC_N8N_EDITOR_BASE_URL: http://n8n:5678
      # VPS Bridge (internal-only)
      VPS_BRIDGE_URL: http://vps-bridge:3003
    networks:
      - aivory-net
      - traefik-public
    labels:
      - "traefik.enable=true"
      # Router
      - "traefik.http.routers.aivory-dashboard.rule=Host(`dashboard.aivory.id`)"
      - "traefik.http.routers.aivory-dashboard.entrypoints=websecure"
      - "traefik.http.routers.aivory-dashboard.tls=true"
      - "traefik.http.routers.aivory-dashboard.tls.certresolver=letsencrypt"
      # Service
      - "traefik.http.services.aivory-dashboard.loadbalancer.server.port=3000"
      # Middlewares (HTTPS redirect)
      - "traefik.http.routers.aivory-dashboard-http.rule=Host(`dashboard.aivory.id`)"
      - "traefik.http.routers.aivory-dashboard-http.entrypoints=web"
      - "traefik.http.routers.aivory-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

networks:
  aivory-net:
    external: true
  traefik-public:
    external: true

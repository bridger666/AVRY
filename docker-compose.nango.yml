# Nango OAuth Integration Service
# Self-hosted Nango for AVRY OAuth token management
#
# Usage:
#   docker compose -f docker-compose.nango.yml up -d
#
# After starting, configure providers in Nango Dashboard at http://localhost:3004

services:
  nango:
    image: nangohq/nango:latest
    container_name: avry-nango
    ports:
      - "3004:3003"     # Map to 3004 externally (3003 is used by vps-bridge)
    environment:
      - NANGO_SECRET_KEY=${NANGO_SECRET_KEY}
      - NANGO_WEBHOOK_URL=${BACKEND_URL:-http://host.docker.internal:3001}/nango/webhook
      - NANGO_WEBHOOK_SECRET=${NANGO_WEBHOOK_SECRET}
      - NANGO_SERVER_URL=http://localhost:3004
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
